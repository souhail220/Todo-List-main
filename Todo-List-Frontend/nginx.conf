server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Optional: proxy /api to Spring Boot (build with VITE_API_BASE_URL=/api)
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
